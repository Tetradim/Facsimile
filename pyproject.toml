[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "facsimile-breakout"
version = "0.1.0"
description = "Clean-room weekly consolidation breakout scanner designed for later Sentinel Edge integration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/facsimile"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
